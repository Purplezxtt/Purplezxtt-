<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Vixion Play</title>

<style>
/* Layout: app de uma coluna no celular. Barra superior fixa (logo, busca, tema); abas Vdeos, Shorts e Posts na barra inferior com boto central de criar. Vdeos publicados ficam salvos no aparelho (IndexedDB). */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --fg:#0F1A1B; --muted:#5B6B6C; --line:#DDE5E4;
  --accent:#0A7C86; --accent-ink:#FFFFFF; --hot:#E8590C; --shadow:0 1px 2px rgba(15,26,27,.06);
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"DM Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0B1213;--surface:#121C1E;--fg:#E8F1F0;--muted:#8FA3A4;--line:#223033;--accent:#35D0C4;--accent-ink:#04201F;--hot:#FF8A4C;--shadow:none;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0B1213;--surface:#121C1E;--fg:#E8F1F0;--muted:#8FA3A4;--line:#223033;--accent:#35D0C4;--accent-ink:#04201F;--hot:#FF8A4C;--shadow:none;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0}
.logo{display:flex;align-items:center;gap:7px;font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.02em;white-space:nowrap}
.logo svg{width:30px;height:30px;flex:none}
.logo span{font-weight:500;color:var(--muted)}
.search{flex:1;min-width:0}
.search input{width:100%;height:38px;border-radius:19px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px;font:inherit}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);flex:none}
.icon-btn svg{width:19px;height:19px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px 16px;padding-top:6px}
.vid{display:block;text-align:left;width:100%}
.thumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;max-width:100%;background:var(--line)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.78);color:#fff;font-size:12px;font-weight:700;padding:2px 6px;border-radius:5px;font-variant-numeric:tabular-nums}
.meta{display:flex;gap:10px;padding-top:10px}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--accent-ink);font-weight:700;font-size:14px;background:var(--accent)}
.meta h3{margin:0;font-size:15px;font-weight:700;line-height:1.3;text-wrap:balance;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px}
.minw{min-width:0}

.empty{margin:36px auto;max-width:340px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ic{width:64px;height:64px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}
.empty .ic svg{width:30px;height:30px}
.empty h2{font-family:var(--font-display);font-size:20px;margin:4px 0 0;letter-spacing:-.01em}
.empty p{margin:0;color:var(--muted)}

.shorts{height:calc(100svh - 150px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:420px;overflow-y:auto;scroll-snap-type:y mandatory;display:flex;flex-direction:column;gap:12px;scrollbar-width:none;border-radius:18px;margin-top:4px}
.shorts::-webkit-scrollbar{display:none}
.short{position:relative;flex:none;height:100%;scroll-snap-align:start;border-radius:18px;overflow:hidden;color:#fff;max-width:100%;background:#000}
.short video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.short::after{content:"";position:absolute;inset:auto 0 0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,.65));pointer-events:none}
.tap{position:absolute;inset:0;width:100%;z-index:1}
.pauseflag{position:absolute;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none;opacity:0;transition:opacity .2s}
.short.paused .pauseflag{opacity:1}
.pauseflag span{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center}
.pauseflag svg{width:28px;height:28px;fill:#fff;stroke:none}
.sinfo{position:absolute;left:14px;right:80px;bottom:18px;z-index:3;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.sinfo b{display:block;font-size:16px}
.sinfo p{margin:4px 0 0;font-size:14px;overflow-wrap:anywhere}
.rail{position:absolute;right:10px;bottom:18px;z-index:3;display:flex;flex-direction:column;gap:14px;align-items:center}
.rail button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.rail .b{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.4);display:grid;place-items:center;backdrop-filter:blur(4px)}
.rail svg{width:22px;height:22px}
.rail .liked svg{fill:#FF5A6E;stroke:#FF5A6E}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25);z-index:3}
.prog i{display:block;height:100%;width:0;background:#fff}

.compose{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:10px;margin:6px 0 12px;box-shadow:var(--shadow)}
.compose textarea{width:100%;border:0;background:transparent;color:var(--fg);font:inherit;resize:none;height:56px}
.compose .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.count.over{color:var(--hot);font-weight:700}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:700;padding:9px 18px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.on{background:var(--fg);color:var(--bg)}
.btn.danger{background:transparent;border:1px solid var(--hot);color:var(--hot)}
.btn.block{width:100%}
.post{display:flex;gap:10px;padding:14px 4px;border-bottom:1px solid var(--line)}
.post .body{flex:1;min-width:0}
.post p{margin:2px 0 8px;overflow-wrap:anywhere;white-space:pre-wrap}
.post .who span{color:var(--muted);font-size:14px}
.acts{display:flex;gap:28px;color:var(--muted);font-size:13px}
.acts button{display:flex;align-items:center;gap:6px;padding:4px 0}
.acts svg{width:18px;height:18px}
.acts .liked{color:#E0405A}
.acts .liked svg{fill:#E0405A}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr auto 1fr;align-items:center;gap:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--muted);padding:4px 0}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.plus{width:50px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.plus svg{width:22px;height:22px}

.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.sheet .in{max-width:760px;margin:0 auto;padding:0 0 24px}
.player{position:relative;aspect-ratio:16/9;background:#000;max-width:100%;overflow:hidden}
.player video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.close{position:absolute;left:10px;top:10px;z-index:2;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.close svg{width:18px;height:18px}
.sec{padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.sec h2{font-family:var(--font-display);font-size:21px;line-height:1.15;margin:14px 0 6px;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.row2{display:flex;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap}
.row2 .grow{flex:1;min-width:0}
.cm{display:flex;gap:10px;margin:12px 0}
.cm p{margin:0;overflow-wrap:anywhere}
.cin{display:flex;gap:8px;margin-top:8px}
.cin input,.field input{flex:1;min-width:0;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px;font:inherit;width:100%}
.hdr{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-left,0px));}
.hdr .icon-btn{flex:none}
.hdr h2{font-family:var(--font-display);font-size:20px;margin:0;letter-spacing:-.01em}
.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.field label,.field .lb{font-weight:700;font-size:14px}
.pick{display:flex;flex-direction:column;align-items:center;gap:8px;border:2px dashed var(--line);border-radius:16px;padding:22px 12px;text-align:center;cursor:pointer;background:var(--surface);color:var(--muted)}
.pick svg{width:30px;height:30px;color:var(--accent)}
.pick input{position:absolute;width:1px;height:1px;opacity:0}
.pv{display:flex;gap:12px;align-items:center;margin-top:10px}
.pv img{width:110px;border-radius:10px;aspect-ratio:16/9;object-fit:cover;background:var(--line);max-width:40%}
.pv.v img{width:64px;aspect-ratio:9/16;max-width:25%}
.menu{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.menu .card{width:100%;max-width:760px;background:var(--surface);border-radius:20px 20px 0 0;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.menu .opt{display:flex;align-items:center;gap:14px;text-align:left;padding:12px;border-radius:14px;border:1px solid var(--line)}
.menu .opt svg{width:24px;height:24px;color:var(--accent);flex:none}
.menu .opt b{display:block}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:60;max-width:90%;text-align:center}
.note{color:var(--muted);font-size:13px;text-align:center;margin:20px 0 0}
.err{color:var(--hot);font-size:14px;margin:6px 0 0}
h1.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.av img,.bigav img{width:100%;height:100%;object-fit:cover;display:block}
.av{overflow:hidden}
.icon-btn.avb{padding:0;overflow:hidden;border:2px solid var(--line)}
.icon-btn .av{width:100%;height:100%;border-radius:50%;font-size:15px}
.banner{position:relative;height:120px}
.bigav{width:84px;height:84px;border-radius:50%;border:4px solid var(--bg);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:34px;color:#fff;overflow:hidden;margin-top:-42px;flex:none}
.pavrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;position:relative;z-index:1}
.field>input{flex:none}
.pn{font-family:var(--font-display);font-size:24px;margin:10px 0 2px;letter-spacing:-.01em;overflow-wrap:anywhere}
.bio{margin:8px 0;overflow-wrap:anywhere}
.stats{display:flex;gap:22px;margin:12px 0 16px}
.stats b{display:block;font-size:19px;font-family:var(--font-display)}
.sec h3.sh{font-family:var(--font-display);font-size:17px;margin:22px 0 10px}
.tag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px}
.edav{display:flex;align-items:center;gap:14px;margin:8px 0 4px}
.edav .bigav{margin-top:0;border-color:var(--line)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.hrow{display:flex;align-items:center;gap:8px}
.hrow span{font-weight:700;color:var(--muted);font-size:18px}
.help{font-size:13px;color:var(--muted);margin:0}
.banner{height:auto;aspect-ratio:16/6;min-height:110px;max-height:230px;background-size:cover!important;background-position:center!important}
.banner::after{content:"";position:absolute;inset:auto 0 0;height:40%;background:linear-gradient(transparent,rgba(0,0,0,.28));pointer-events:none}
.pavrow .bigav{width:96px;height:96px;margin-top:-48px;font-size:38px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.pacts{display:flex;gap:8px;align-items:center;padding-bottom:4px}
.pmeta{display:flex;flex-wrap:wrap;gap:4px 8px;color:var(--muted);font-size:14px}
.pmeta b{color:var(--fg);font-weight:700}
.ptabs{display:flex;border-bottom:1px solid var(--line);margin:18px 0 16px}
.ptabs button{flex:1;padding:12px 0;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.ptabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.bnprev{width:100%;aspect-ratio:16/6;border-radius:14px;background-size:cover;background-position:center;border:1px solid var(--line);margin-top:6px}
.thbtns{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:340px){.logo span{display:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="logo" aria-label="Vixion Play">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="29" rx="9" style="fill:var(--accent);stroke:none"/><path d="M9 10l7 13 7-13" style="stroke:var(--accent-ink);stroke-width:3"/><circle cx="16" cy="8" r="1.6" style="fill:var(--accent-ink);stroke:none"/></svg>
      <div>Vixion <span>Play</span></div>
    </div>
    <label class="search"><h1 class="vh">Vixion Play</h1><input id="q" type="search" placeholder="Buscar" aria-label="Buscar v&#237;deos"></label>
    <button class="icon-btn" id="theme" aria-label="Alternar tema"><svg viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
    <button class="icon-btn avb" id="prof" aria-label="Meu canal"></button>
  </header>

  <main>

</div>

</div></nav>

<div class="sheet" id="sheet" hidden></div>

function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

var st={tab:"videos",q:"",muted:true,liked:lsGet("vx-liked",{}),ch:lsGet("vx-channel","")};
var LIB=[],POSTS=lsGet("vx-posts",[]),URLS={},DB=null,dbOk=true;
var PROF=lsGet("vx-profile",null);
function pName(){return PROF?PROF.name:"Meu canal"}
function pHandle(){return PROF?"@"+PROF.handle:"@canal"}
function avH(){return '<div class="av" style="background:hsl('+(PROF?PROF.hue:180)+' 55% 38%);color:#fff">'+(PROF&&PROF.avatar?'<img alt="" src="'+PROF.avatar+'">':esc(init(pName())))+'</div>'}

/* armazenamento de v\u00eddeos no aparelho */
function openDB(){return new Promise(function(res,rej){
  if(!window.indexedDB){rej();return}
  var r=indexedDB.open("vixion",1);
  r.onupgradeneeded=function(){r.result.createObjectStore("videos",{keyPath:"id"})};
  r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};
})}
function dbAll(){return new Promise(function(res,rej){var q=DB.transaction("videos").objectStore("videos").getAll();q.onsuccess=function(){res(q.result||[])};q.onerror=function(){rej(q.error)}})}
function dbPut(v){return new Promise(function(res,rej){var t=DB.transaction("videos","readwrite");t.objectStore("videos").put(v);t.oncomplete=res;t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}})}
function dbDel(id){return new Promise(function(res,rej){var t=DB.transaction("videos","readwrite");t.objectStore("videos").delete(id);t.oncomplete=res;t.onerror=function(){rej(t.error)}})}
function urlOf(v){if(!URLS[v.id])URLS[v.id]=URL.createObjectURL(v.blob);return URLS[v.id]}
function kind(k){return LIB.filter(function(v){return v.kind===k}).sort(function(a,b){return b.created-a.created})}

/* v\u00eddeos */
function emptyBlock(icon,title,text,btn){
  return '<div class="empty"><div class="ic">'+icon+'</div><h2>'+title+'</h2><p>'+text+'</p>'+(btn?'<button class="btn" data-publish>'+btn+'</button>':'')+'</div>';
}
function drawGrid(){
  var q=st.q.toLowerCase();
  var list=kind("video").filter(function(v){return !q||(v.title+" "+pName()+" "+pHandle()).toLowerCase().indexOf(q)>-1});
  if(!list.length){
    $("#grid").innerHTML=st.q?'<div class="empty" style="grid-column:1/-1"><p>Nenhum v\u00eddeo encontrado.</p></div>':
      '<div style="grid-column:1/-1">'+emptyBlock(ICON.film,"Nenhum v\u00eddeo ainda","Publique o primeiro v\u00eddeo do seu canal. Ele aparece aqui.","Publicar v\u00eddeo")+'</div>';
    return;
  }
  $("#grid").innerHTML=list.map(function(v){
    return '<button class="vid" data-vid="'+v.id+'"><div class="thumb">'+(v.thumb?'<img alt="" src="'+v.thumb+'">':'')+'<span class="dur">'+dur(v.dur)+'</span></div>'+
    '<div class="meta">'+avH()+'<div class="minw"><h3>'+esc(v.title)+'</h3><div class="sub">'+esc(pName())+' \u00b7 '+fmt(v.views||0)+' views \u00b7 '+ago(v.created)+'</div></div></div></button>';

/* shorts */
var io=null;
function pauseAll(){document.querySelectorAll("#shortsbox video").forEach(function(v){try{v.pause()}catch(e){}})}
function drawShorts(){
  var box=$("#shortsbox"),list=kind("short");
  if(io){io.disconnect();io=null}
  if(!list.length){box.innerHTML=emptyBlock(ICON.rect,"Nenhum short ainda","V\u00eddeos gravados em p\u00e9 aparecem aqui, em tela cheia.","Publicar v\u00eddeo");return}
  box.innerHTML='<div class="shorts" id="shorts">'+list.map(function(s){
    var on=st.liked["s"+s.id];
    return '<article class="short" data-s="'+s.id+'"><video src="'+urlOf(s)+'" '+(s.thumb?'poster="'+s.thumb+'" ':'')+'loop playsinline '+(st.muted?'muted ':'')+'preload="metadata"></video>'+
    '<button class="tap" data-tap aria-label="Pausar ou continuar"></button><div class="pauseflag"><span>'+ICON.play+'</span></div>'+
    '<div class="sinfo"><b>'+esc(pHandle())+'</b><p>'+esc(s.title)+'</p></div>'+
    '<div class="rail"><button class="'+(on?"liked":"")+'" data-slike="'+s.id+'"><span class="b">'+ICON.heart+'</span><span>'+fmt((s.likes||0)+(on?1:0))+'</span></button>'+
    '<button data-mute><span class="b">'+(st.muted?ICON.mute:ICON.vol)+'</span><span>'+(st.muted?"Mudo":"Som")+'</span></button>'+
    '<button data-del="'+s.id+'"><span class="b">'+ICON.trash+'</span><span>Excluir</span></button></div>'+
    '<div class="prog"><i></i></div></article>';
  }).join("")+'</div>';
  var root=$("#shorts");
  io=new IntersectionObserver(function(es){es.forEach(function(e){
    var v=e.target.querySelector("video");
    if(e.isIntersecting&&e.intersectionRatio>.7){e.target.classList.remove("paused");var p=v.play();if(p&&p.catch)p.catch(function(){})}
    else{try{v.pause()}catch(x){}}
  })},{root:root,threshold:[0,.7,1]});
  root.querySelectorAll(".short").forEach(function(el){
    io.observe(el);
    var v=el.querySelector("video"),bar=el.querySelector(".prog i");
    v.ontimeupdate=function(){if(v.duration)bar.style.width=(v.currentTime/v.duration*100)+"%"};
  });
}

/* posts */
function drawPosts(){
  if(!POSTS.length){$("#posts").innerHTML=emptyBlock(ICON.note,"Nenhum post ainda","Escreva algo no campo acima para abrir o feed.");return}
  $("#posts").innerHTML=POSTS.map(function(p){
    var on=st.liked["p"+p.id];
    return '<article class="post">'+avH()+'<div class="body"><div class="who"><b>'+esc(pName())+'</b> <span>'+esc(pHandle())+' \u00b7 '+ago(p.id)+'</span></div>'+
    '<p>'+esc(p.t)+'</p><div class="acts"><button class="'+(on?"liked":"")+'" data-plike="'+p.id+'">'+ICON.heart+fmt((p.l||0)+(on?1:0))+'</button>'+
    '<button data-pdel="'+p.id+'" aria-label="Excluir post">'+ICON.trash+'</button></div></div></article>';
  }).join("");
}

/* abas */
function go(tab,silent){
  st.tab=tab;
  ["videos","shorts","posts"].forEach(function(t){$("#v-"+t).hidden=t!==tab});
  document.querySelectorAll(".tab").forEach(function(b){if(b.dataset.tab===tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  if(tab!=="shorts")pauseAll();
  if(tab==="shorts")drawShorts();
  if(!silent){try{history.replaceState(null,"","#"+tab)}catch(e){location.hash=tab}}
  window.scrollTo(0,0);
}

/* excluir com confirma\u00e7\u00e3o */
var pend=null;
function askDelete(id){
  if(pend&&pend.id===id){clearTimeout(pend.t);pend=null;removeVideo(id);return}
  if(pend)clearTimeout(pend.t);
  pend={id:id,t:setTimeout(function(){pend=null},3500)};
  toast("Toque de novo para excluir");
}
function removeVideo(id){
  dbDel(id).catch(function(){}).then(function(){
    LIB=LIB.filter(function(v){return v.id!==id});
    if(URLS[id]){URL.revokeObjectURL(URLS[id]);delete URLS[id]}
    closeSheet();drawGrid();if(st.tab==="shorts")drawShorts();toast("V\u00eddeo exclu\u00eddo");
  });
}

/* publicar v\u00eddeo */
function probe(file){return new Promise(function(res,rej){
  var u=URL.createObjectURL(file),v=document.createElement("video"),done=false;
  v.muted=true;v.playsInline=true;v.preload="metadata";
  function fail(){if(done)return;done=true;URL.revokeObjectURL(u);rej()}
  var to=setTimeout(fail,12000);
  v.onerror=fail;
  v.onloadedmetadata=function(){try{v.currentTime=Math.min(1,(v.duration||2)/2)}catch(e){}};
  v.onseeked=function(){
    if(done)return;done=true;clearTimeout(to);
    var w=v.videoWidth,h=v.videoHeight,c=document.createElement("canvas"),sc=Math.min(1,640/Math.max(w,h));
    c.width=Math.round(w*sc);c.height=Math.round(h*sc);
    var thumb="";try{c.getContext("2d").drawImage(v,0,0,c.width,c.height);thumb=c.toDataURL("image/jpeg",.72)}catch(e){}
    var d=v.duration;URL.revokeObjectURL(u);res({thumb:thumb,dur:d,vertical:h>w});
  };
  v.src=u;
})}
function openPublish(){
  closeMenu();
  if(!PROF){openProfileEdit(openPublish);return}
  var sh=$("#sheet"),info=null,file=null,cthumb=null;
  sh.innerHTML='<div class="in"><div class="hdr"><button class="icon-btn" id="cl" aria-label="Voltar">'+ICON.back+'</button><h2>Publicar v\u00eddeo</h2></div>'+
   '<form class="sec" id="pf"><label class="pick" for="f">'+ICON.up+'<b style="color:var(--fg)">Escolher v\u00eddeo</b><span>Da galeria ou dos arquivos do aparelho</span><input id="f" type="file" accept="video/*"></label>'+
   '<div class="pv" id="pv" hidden><img id="pi" alt=""><div class="minw"><div id="pk"><b></b></div><div class="sub" id="pd"></div></div></div><p class="err" id="er" hidden></p>'+
   '<div class="field" id="thf" hidden><span class="lb">Miniatura</span><div class="thbtns"><label class="btn ghost" for="tf" style="cursor:pointer;position:relative">Escolher imagem<input id="tf" type="file" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0"></label><button type="button" class="btn ghost" id="trs" hidden>Usar quadro do v\u00eddeo</button></div><p class="help">Sem escolher, usamos um quadro do v\u00eddeo.</p></div>'+
   '<div class="field"><label for="tt">T\u00edtulo</label><input id="tt" maxlength="100" placeholder="D\u00ea um t\u00edtulo ao v\u00eddeo"></div>'+
   '<p class="sub">O v\u00eddeo fica salvo neste aparelho e neste navegador. Outras pessoas ainda n\u00e3o conseguem ver.</p>'+
   '<button class="btn block" id="go" type="submit" disabled>Publicar</button></form></div>';
  sh.hidden=false;sh.scrollTop=0;document.body.style.overflow="hidden";
  $("#cl",sh).onclick=closeSheet;
  var er=$("#er",sh),goBtn=$("#go",sh);
  $("#f",sh).onchange=function(){
    file=this.files&&this.files[0];if(!file)return;
    er.hidden=true;goBtn.disabled=true;info=null;cthumb=null;$("#thf",sh).hidden=true;$("#trs",sh).hidden=true;
    $("#pv",sh).hidden=false;$("#pk",sh).innerHTML="<b>Lendo o v\u00eddeo\u2026</b>";$("#pd",sh).textContent="";$("#pi",sh).removeAttribute("src");
    if(!$("#tt",sh).value)$("#tt",sh).value=file.name.replace(/\.[^.]+$/,"").slice(0,100);
    probe(file).then(function(r){
      info=r;$("#pi",sh).src=r.thumb;$("#pv",sh).classList.toggle("v",r.vertical);
      $("#pk",sh).innerHTML="<b>"+(r.vertical?"Vai para Shorts":"Vai para V\u00eddeos")+"</b>";
      $("#pd",sh).textContent=dur(r.dur)+" \u00b7 "+(file.size/1048576).toFixed(1).replace(".",",")+" MB";
      goBtn.disabled=false;$("#thf",sh).hidden=false;
    }).catch(function(){
      $("#pv",sh).hidden=true;er.textContent="N\u00e3o consegui abrir esse v\u00eddeo neste navegador. Tente um arquivo MP4.";er.hidden=false;
    });
  };
  $("#tf",sh).onchange=function(){var f=this.files&&this.files[0];this.value="";if(!f||!info)return;
    var v=info.vertical;
    toCover(f,v?360:640,v?640:360,.85).then(function(t){cthumb=t;$("#pi",sh).src=t;$("#trs",sh).hidden=false;toast("Miniatura escolhida")}).catch(function(){toast("N\u00e3o consegui abrir essa imagem")})};
  $("#trs",sh).onclick=function(){cthumb=null;$("#pi",sh).src=info.thumb;this.hidden=true};
  $("#pf",sh).onsubmit=function(e){
    e.preventDefault();
    if(!info||!file||!DB){if(!DB){er.textContent="Este navegador n\u00e3o permite salvar v\u00eddeos.";er.hidden=false}return}
    var title=$("#tt",sh).value.trim()||"Sem t\u00edtulo",ch=pName();
    goBtn.disabled=true;goBtn.textContent="Salvando\u2026";
    var rec={id:Date.now(),title:title,ch:ch,kind:info.vertical?"short":"video",dur:info.dur,thumb:cthumb||info.thumb,blob:file,created:Date.now(),views:0,likes:0};
    dbPut(rec).then(function(){
      LIB.unshift(rec);closeSheet();drawGrid();go(rec.kind==="short"?"shorts":"videos");toast("V\u00eddeo publicado");
    }).catch(function(){
      goBtn.disabled=false;goBtn.textContent="Publicar";er.textContent="N\u00e3o coube no espa\u00e7o deste aparelho. Tente um v\u00eddeo menor.";er.hidden=false;
    });
  };
}

function cleanHandle(x){return String(x).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/^@+/,"").replace(/[^a-z0-9_.]/g,"").slice(0,20)}
function toAvatar(file){return new Promise(function(res,rej){
  var u=URL.createObjectURL(file),i=new Image();
  i.onload=function(){var m=Math.min(i.width,i.height),c=document.createElement("canvas");c.width=c.height=256;
    c.getContext("2d").drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,256,256);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.85))};
  i.onerror=function(){URL.revokeObjectURL(u);rej()};i.src=u;
})}
function toCover(file,w,h,q){return new Promise(function(res,rej){
  var u=URL.createObjectURL(file),i=new Image();
  i.onload=function(){var r=w/h,sw=i.width,sh=i.height;
    if(sw/sh>r)sw=sh*r;else sh=sw/r;
    var c=document.createElement("canvas");c.width=w;c.height=h;
    c.getContext("2d").drawImage(i,(i.width-sw)/2,(i.height-sh)/2,sw,sh,0,0,w,h);
    URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",q||.85))};
  i.onerror=function(){URL.revokeObjectURL(u);rej()};i.src=u;
})}

  sh.innerHTML='<div class="in"><div class="hdr"><button class="icon-btn" id="cl" aria-label="Voltar">'+ICON.back+'</button><h2>'+(first?"Criar seu canal":"Editar canal")+'</h2></div>'+
   '<form class="sec" id="pfm"><div class="field" style="margin-top:4px"><span class="lb">Banner do canal</span><div class="bnprev" id="bn" style="background:'+bannerBg(d)+'"></div><div class="thbtns" style="margin-top:8px"><label class="btn ghost" for="bfile" style="cursor:pointer;position:relative">Escolher banner<input id="bfile" type="file" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0"></label><button type="button" class="btn ghost" id="brm"'+(d.banner?'':' hidden')+'>Remover banner</button></div></div><div class="edav"><div id="av">'+bigAv(d)+'</div><div style="display:flex;flex-direction:column;gap:8px"><label class="btn ghost" for="pfile" style="cursor:pointer;position:relative">Escolher foto<input id="pfile" type="file" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0"></label><button type="button" class="btn ghost" id="rm"'+(d.avatar?'':' hidden')+'>Remover foto</button></div></div>'+
   '<div class="field"><span class="lb">Cor do canal</span><div class="swatches" id="sws">'+HUES.map(function(h){return '<button type="button" class="sw" data-hue="'+h+'" aria-label="Cor '+h+'" aria-pressed="'+(h===d.hue)+'" style="background:hsl('+h+' 60% 42%)"></button>'}).join("")+'</div></div>'+
   '<div class="field"><label for="pn">Nome do canal</label><input id="pn" maxlength="30" placeholder="Ex.: Pesca do Z\u00e9" value="'+esc(d.name)+'" autocomplete="off"></div>'+
   '<div class="field"><label for="ph">Seu @</label><div class="hrow"><span>@</span><input id="ph" maxlength="20" placeholder="pescadoze" value="'+esc(d.handle)+'" autocomplete="off" autocapitalize="none" spellcheck="false"></div><p class="help" id="hh">3 a 20 caracteres: letras min\u00fasculas, n\u00fameros, _ ou .</p></div>'+
   '<div class="field"><label for="pbio">Sobre o canal</label><input id="pbio" maxlength="120" placeholder="Uma frase sobre voc\u00ea" value="'+esc(d.bio)+'" autocomplete="off"></div>'+
   '<p class="sub">O canal fica salvo neste aparelho. O @ ainda n\u00e3o \u00e9 \u00fanico entre pessoas.</p>'+
   '<button class="btn block" id="sv" type="submit" disabled>'+(first?"Criar canal":"Salvar")+'</button></form></div>';
  sh.hidden=false;sh.scrollTop=0;document.body.style.overflow="hidden";
  function preview(){$("#av",sh).innerHTML=bigAv(d);$("#bn",sh).style.background=bannerBg(d)}
  function validate(){
    var ok=d.name.trim().length>=2&&okH.test(d.handle);$("#sv",sh).disabled=!ok;
    $("#hh",sh).textContent=d.handle&&!okH.test(d.handle)?"Use pelo menos 3 caracteres: letras, n\u00fameros, _ ou .":"3 a 20 caracteres: letras min\u00fasculas, n\u00fameros, _ ou .";
  }
  $("#cl",sh).onclick=closeSheet;
  $("#pn",sh).oninput=function(){d.name=this.value;if(!touched){d.handle=cleanHandle(d.name);$("#ph",sh).value=d.handle}preview();validate()};
  $("#ph",sh).oninput=function(){touched=true;d.handle=cleanHandle(this.value);this.value=d.handle;validate()};
  $("#pbio",sh).oninput=function(){d.bio=this.value};
  $("#sws",sh).onclick=function(e){var b=e.target.closest("button");if(!b)return;d.hue=+b.dataset.hue;
    this.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed",x===b)});preview()};
  $("#pfile",sh).onchange=function(){var f=this.files&&this.files[0];if(!f)return;
    toAvatar(f).then(function(a){d.avatar=a;preview();$("#rm",sh).hidden=false}).catch(function(){toast("N\u00e3o consegui abrir essa imagem")})};
  $("#bfile",sh).onchange=function(){var f=this.files&&this.files[0];this.value="";if(!f)return;
    toCover(f,960,360,.82).then(function(a){d.banner=a;preview();$("#brm",sh).hidden=false}).catch(function(){toast("N\u00e3o consegui abrir essa imagem")})};
  $("#brm",sh).onclick=function(){d.banner="";preview();this.hidden=true};
  $("#rm",sh).onclick=function(){d.avatar="";preview();this.hidden=true};
  $("#pfm",sh).onsubmit=function(e){
    e.preventDefault();if(!(d.name.trim().length>=2&&okH.test(d.handle)))return;
    PROF={name:d.name.trim(),handle:d.handle,bio:d.bio.trim(),hue:d.hue,avatar:d.avatar,banner:d.banner,created:PROF?PROF.created:Date.now()};
    lsSet("vx-profile",PROF);
    updateProfBtn();updateMyAv();drawGrid();drawPosts();if(st.tab==="shorts")drawShorts();
    closeSheet();toast(first?"Canal criado":"Canal atualizado");
    if(after)after();else if(first)openProfile();
  };
  validate();
}

/* eventos */
document.addEventListener("click",function(e){
  var menu=$("#menu");
  if(!menu.hidden&&e.target===menu){closeMenu();return}
  var t=e.target.closest("button");if(!t)return;
  if(t.dataset.tab){go(t.dataset.tab);return}
  if(t.dataset.vid){openVideo(t.dataset.vid);return}
  if(t.hasAttribute("data-publish")){openPublish();return}
  if(t.hasAttribute("data-newpost")){closeMenu();go("posts");setTimeout(function(){$("#ptxt").focus()},50);return}
  if(t.dataset.slike){var k=t.dataset.slike;st.liked["s"+k]=!st.liked["s"+k];lsSet("vx-liked",st.liked);
    var el=t.closest(".short"),on=st.liked["s"+k],s=LIB.filter(function(x){return x.id==k})[0];
    t.classList.toggle("liked",on);t.querySelector("span:last-child").textContent=fmt((s.likes||0)+(on?1:0));return}
  if(t.dataset.plike){var k2="p"+t.dataset.plike;st.liked[k2]=!st.liked[k2];lsSet("vx-liked",st.liked);drawPosts();return}
  if(t.dataset.pdel){POSTS=POSTS.filter(function(p){return String(p.id)!==t.dataset.pdel});lsSet("vx-posts",POSTS);drawPosts();return}
  if(t.dataset.del){askDelete(+t.dataset.del);return}
  if(t.hasAttribute("data-mute")){st.muted=!st.muted;document.querySelectorAll("#shortsbox video").forEach(function(v){v.muted=st.muted});
    document.querySelectorAll("[data-mute]").forEach(function(b){b.innerHTML='<span class="b">'+(st.muted?ICON.mute:ICON.vol)+'</span><span>'+(st.muted?"Mudo":"Som")+'</span>'});return}
  if(t.hasAttribute("data-tap")){var sh=t.closest(".short"),v=sh.querySelector("video");
    if(v.paused){v.play();sh.classList.remove("paused")}else{v.pause();sh.classList.add("paused")}return}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if(!$("#menu").hidden)closeMenu();else if(!$("#sheet").hidden)closeSheet()}});
$("#q").addEventListener("input",function(){st.q=this.value;if(st.tab!=="videos")go("videos");drawGrid()});
$("#theme").addEventListener("click",function(){
  var r=document.documentElement,cur=r.getAttribute("data-theme");
  if(!cur)cur=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  r.setAttribute("data-theme",cur==="dark"?"light":"dark");
});
$("#plus").addEventListener("click",openMenu);
$("#prof").addEventListener("click",openProfile);
var pt=$("#ptxt"),pb=$("#pbtn"),cn=$("#cnt");
pt.addEventListener("input",function(){
  var left=280-pt.value.length;cn.textContent=left;cn.classList.toggle("over",left<0);
  pb.disabled=!pt.value.trim()||left<0;
});
pb.addEventListener("click",function(){
  var t=pt.value.trim();if(!t||t.length>280)return;
  if(!PROF){openProfileEdit(function(){pb.click()});return}
  POSTS.unshift({id:Date.now(),t:t,l:0});lsSet("vx-posts",POSTS);
  pt.value="";cn.textContent="280";pb.disabled=true;drawPosts();toast("Post publicado");
});
window.addEventListener("hashchange",function(){var h=location.hash.slice(1);if(["videos","shorts","posts"].indexOf(h)>-1)go(h,true)});

updateProfBtn();updateMyAv();
drawGrid();drawPosts();
var h0=location.hash.slice(1);go(["videos","shorts","posts"].indexOf(h0)>-1?h0:"videos",true);
openDB().then(function(d){DB=d;return dbAll()}).then(function(all){LIB=all;drawGrid();if(st.tab==="shorts")drawShorts()}).catch(function(){dbOk=false});
})();
</script>

</body></html>
