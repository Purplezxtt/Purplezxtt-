  if(m&&m[1]!==APP_VER&&m[1]!==verSeen){verSeen=m[1];pushN({k:'ver',tag:'ver'});note(cx('nv'))}}catch(e){}}

 cfg.nt.unshift(n);cfg.nt=cfg.nt.slice(0,60);saveCfg();renderBell(!q)}
function updNotes(){cfg.nt=cfg.nt.filter(x=>x.k!=='ver'&&(x.k!=='upd'||CH.some(c=>c.id===x.u)));let ad=0;CH.forEach(c=>{if(c.own)return;if(!cfg.seenU.includes(c.id)){cfg.seenU.push(c.id);if(!FIRST||c.code){pushN({k:'upd',u:c.id},1);ad++}}});saveCfg();if(ad)renderBell(true)}
let AC;function ding(){if(cfg.nsound===false||$('#player').classList.contains('on'))return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime;
 [[1568,0],[2093,.17]].forEach(([f,d])=>[[1,.22],[2.76,.07]].forEach(([m,v])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f*m;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(v,t+d+.01);g.gain.exponentialRampToValueAtTime(.0008,t+d+1);o.connect(g);g.connect(AC.destination);o.start(t+d);o.stop(t+d+1.1)}))}catch(e){}}
function renderBell(hit){const b=$('#bell');if(!b)return;const n=cfg.nt.filter(x=>!x.r).length;b.classList.toggle('has',n>0);b.querySelector('b').textContent=n>99?'99+':n;
 if(hit&&n>0){ding();b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');try{if(navigator.vibrate)navigator.vibrate([40,40,40])}catch(e){}setTimeout(()=>b.classList.remove('hit'),1000)}}
function openNC(){const l=$('#ncl');l.innerHTML='';$('#nct').textContent='🔔 '+nx('t');$('#ncc').textContent=nx('c');$('#ncx').textContent=nx('x');
 if(!cfg.nt.length){const e=document.createElement('p');e.textContent=nx('e');e.style.color='var(--mut)';l.append(e)}
 cfg.nt.forEach(n=>{const r=document.createElement('div');r.className='nrow'+(n.r?'':' un');const c=n.k==='upd'?CH.find(x=>x.id===n.u):null;
  const ti=document.createElement('b');ti.textContent=(n.k==='msg'?'💬 ':n.k==='req'?'👥 ':n.k==='ver'?'⬆️ ':'✨ ')+(n.k==='upd'?(c&&c.code?kx('nc'):nx('u')):n.k==='ver'?cx('nv'):n.title);
  const bo=document.createElement('div');bo.textContent=c?chT(c)+(c.code?' '+c.code:''):n.k==='ver'?cx('nvb'):n.body;const tm=document.createElement('small');tm.textContent=new Date(n.t).toLocaleString();
  r.append(ti,bo,tm);
  if(n.k==='ver')r.onclick=()=>location.reload();else if(n.k!=='upd'&&n.k!=='ach')r.onclick=async()=>{$('#nc').classList.remove('on');if(!prof.pub){note(ta('f_need'));return}try{await startFr()}catch(e){note(ta('f_err'));return}frHome();$('#fr').classList.add('on');const q=n.k==='msg'?REQ.find(x=>x.id===n.tag):null;if(q)openChat(q)};
  l.append(r)});
 cfg.nt.forEach(n=>n.r=1);saveCfg();renderBell();$('#nc').classList.add('on')}
$('#ns').onchange=e=>{cfg.nsound=e.target.checked;saveCfg();if(cfg.nsound)ding()};
$('#bell').onclick=openNC;$('#ncx').onclick=()=>$('#nc').classList.remove('on');$('#ncc').onclick=()=>{cfg.nt=[];saveCfg();renderBell();$('#ncl').innerHTML='';const e=document.createElement('p');e.textContent=nx('e');e.style.color='var(--mut)';$('#ncl').append(e)};

const HT={pt:'Ajuda',es:'Ayuda',en:'Help',ru:'Помощь',ja:'ヘルプ',de:'Hilfe',fr:'Aide',it:'Aiuto'};
const FQ={
pt:[
['Como adiciono um jogo?','1) No Vox Emulador, toque em Adicionar jogos.\n2) Escolha o arquivo do jogo. Pode ser o .zip direto: o Vox descompacta sozinho. Também serve o arquivo já extraído (por exemplo .gba, .nes, .iso).\n3) O Vox reconhece o console pela extensão e coloca o jogo na pasta certa. Se não reconhecer, o jogo fica em Sem pasta e você escolhe a pasta.\nArquivos .7z e .rar precisam ser extraídos antes, com um app como o ZArchiver.\nUse só jogos que você tem direito de usar: cópias suas, homebrew e jogos livres.'],
['Abri um jogo e só aparece um menu preto (Main Menu). O que é?','Esse menu aparece quando o emulador abriu, mas não recebeu um jogo de verdade para rodar. Os motivos mais comuns:\n• O arquivo é um .cue pequeno (cerca de 1 KB). Ele é só um índice e precisa do arquivo .bin grande junto: adicione o .bin ou use um arquivo único (.chd, .iso ou .pbp).\n• O arquivo ainda está dentro de um .zip: extraia antes.\n• O arquivo veio incompleto ou corrompido.\n• O jogo está na pasta de outro console.'],
['Como sei se meu jogo é de PSP ou de PlayStation 1?','PSP: um único arquivo .iso, .cso ou .pbp, normalmente com mais de 100 MB.\nPlayStation 1: arquivos .bin com .cue, ou um arquivo .chd.\nColoque cada um na pasta do console certo.'],
['Como giro a tela?','Em Configurações, ligue Botão de girar a tela. O botão 🔄 aparece abaixo do ? e também dentro do jogo, ao lado de Fechar jogo. Toque nele para alternar entre horizontal e vertical. Se o navegador não deixar, ligue a rotação automática do Android ou instale o app na tela inicial.'],
['Posso adicionar um arquivo .zip direto?','Pode. Em Adicionar jogos, escolha o .zip e o Vox descompacta sozinho e coloca o jogo na pasta certa (ou em Sem pasta, se não souber qual é). Se ficar em Sem pasta, toque em Identificar e organizar ou escolha a pasta no ⋮ do jogo. Arquivos .7z e .rar ainda precisam ser extraídos antes, por exemplo com o ZArchiver. Se o arquivo for de Arcade, escolha a pasta Arcade antes de adicionar, que ele fica zipado.'],
['Dá para jogar sem internet?','Sim. Os jogos ficam salvos no seu aparelho. Para o emulador funcionar sem internet, o Vox precisa baixar os arquivos dele uma vez: em Configurações, toque em Preparar para jogar offline (com internet). Ele abre um jogo de cada console sozinho, sem som, e guarda tudo. Depois dá para jogar até no modo avião. Amigos, chat, grupos e avisos precisam de internet.'],
['Meu jogo grande (PSP, PS1…) não entra. O que faço?','Jogos de PSP e PS1 têm de 300 MB a mais de 1 GB, e o Vox guarda tudo dentro do navegador, então precisa de espaço livre no celular. Se aparecer sem espaço, libere armazenamento (apague arquivos, apps ou o próprio .zip depois de adicionar). Use o jogo como .iso, .cso ou .pbp, ou o .zip direto. Se der erro ao guardar, tente de novo com o app aberto e a tela ligada até terminar.'],
['Como funcionam a Loja e as Vox coins?','A cada 2 minutos no Vox você ganha 1, 5, 10 ou 20 Vox coins (a moeda cinza vale 1, a vermelha 5, a azul 10 e a roxa 20). Toque nas moedas para ver as missões. Na Loja você compra molduras e fundos ou abre caixas com itens aleatórios; o item aparece em Perfil → Molduras e Fundos. As ofertas com desconto mudam a cada 2 horas, e itens repetidos de caixas devolvem parte das moedas.'],
['Para que servem as pastas?','Cada pasta é de um console e só aceita arquivos daquele tipo. Toque em Nova pasta para criar uma. Para apagar uma pasta, abra ela e toque em Excluir esta pasta: os jogos não são apagados, vão para Sem pasta.'],
['Meu jogo ficou em "Sem pasta". E agora?','Abra a aba Sem pasta e toque em Identificar e organizar: o Vox tenta reconhecer o console de cada jogo. Se não reconhecer, escolha a pasta manualmente na lista que aparece em cada jogo.'],
['Como jogo e salvo meu progresso?','Toque em Jogar. Ao tocar em Fechar jogo ou sair do app, o progresso é salvo sozinho e volta de onde você parou. Para recomeçar, toque em Do início no jogo.'],
['Como mudo o lugar e o tamanho dos botões?','Em Configurações, ligue Controles personalizados e toque em Mover botões. Escolha o console na lista, arraste os botões e use a barra para mudar o tamanho. O botão Imagens dos botões deixa você usar PNG ou GIF.'],
['O jogo está lento ou o som chia. O que faço?','Deixe o celular carregando, desligue a economia de bateria, feche outros apps e abas e evite o Fast-Forward. O número FPS aparece no canto da tela. Nas Configurações há a otimização por jogo (Leve ou Máxima).'],
['Como adiciono amigos e converso?','Seu ID é automático (#1, #2...). Toque em Amigos, pesquise o ID de alguém e envie o pedido. Depois de aceito, vocês podem conversar. O 🗑 ao lado da sua mensagem apaga ela.'],
['Como mando áudio no chat?','Abra o chat com um amigo e toque em Gravar áudio, abaixo do botão Enviar. Permita o microfone se o celular pedir. Fale e toque em Enviar áudio (ou ✕ para cancelar). O limite é de 1 minuto. Você pode apagar um áudio seu com o 🗑.'],
['Como crio um grupo?','Em Amigos, toque em Criar grupo (ao lado de Concluir), dê um nome, marque os amigos que vão entrar e toque em Criar. O grupo aparece na lista de amigos, tem de 2 a 20 pessoas e dá para mandar texto e áudio. Quem criou pode apagar o grupo, e os outros podem sair.'],
['Para que serve o sininho?','Ele mostra mensagens, pedidos de amizade, novidades do Vox e avisos de nova versão. Quando balança, tem algo novo.'],
['Como instalo o Vox Emulador no celular?','No Chrome, toque nos três pontinhos e escolha Instalar app (ou Adicionar à tela inicial).'],
['Meus jogos sumiram. Por quê?','Os jogos ficam salvos só neste aparelho, dentro do navegador. Se você limpar os dados do site, a estante é apagada.']
],
es:[
['¿Cómo agrego un juego?','1) En Vox Emulador toca Agregar juegos.\n2) Elige el archivo del juego. Puede ser el .zip directo: Vox lo descomprime solo. También sirve el archivo ya extraído (por ejemplo .gba, .nes, .iso).\n3) Vox reconoce la consola por la extensión y pone el juego en la carpeta correcta. Si no la reconoce, el juego queda en Sin carpeta y tú eliges la carpeta.\nLos archivos .7z y .rar hay que extraerlos antes, con una app como ZArchiver.\nUsa solo juegos que tengas derecho a usar: copias tuyas, homebrew y juegos libres.'],
['Abrí un juego y solo aparece un menú negro (Main Menu). ¿Qué es?','Ese menú aparece cuando el emulador abrió pero no recibió un juego real para ejecutar. Los motivos más comunes:\n• El archivo es un .cue pequeño (unos 1 KB). Es solo un índice y necesita el archivo .bin grande: agrega el .bin o usa un archivo único (.chd, .iso o .pbp).\n• El archivo sigue dentro de un .zip: extráelo antes.\n• El archivo llegó incompleto o dañado.\n• El juego está en la carpeta de otra consola.'],
['¿Cómo sé si mi juego es de PSP o de PlayStation 1?','PSP: un único archivo .iso, .cso o .pbp, normalmente de más de 100 MB.\nPlayStation 1: archivos .bin con .cue, o un archivo .chd.\nPon cada uno en la carpeta de la consola correcta.'],
['¿Cómo giro la pantalla?','En Configuración activa Botón para girar la pantalla. El botón 🔄 aparece debajo del ? y también dentro del juego, junto a Cerrar juego. Tócalo para alternar entre horizontal y vertical. Si el navegador no lo permite, activa la rotación automática de Android o instala la app en la pantalla de inicio.'],
['¿Puedo añadir un archivo .zip directamente?','Sí. En Añadir juegos elige el .zip y Vox lo descomprime solo y pone el juego en la carpeta correcta (o en Sin carpeta si no sabe cuál es). Si queda en Sin carpeta, toca Identificar y organizar o elige la carpeta en el ⋮ del juego. Los archivos .7z y .rar aún hay que extraerlos antes, por ejemplo con ZArchiver. Si es de Arcade, elige la carpeta Arcade antes de añadir, porque se queda comprimido.'],
['¿Se puede jugar sin internet?','Sí. Los juegos se guardan en tu dispositivo. Para que el emulador funcione sin internet, Vox debe descargar sus archivos una vez: en Configuración toca Preparar para jugar sin conexión (con internet). Abre un juego de cada consola solo, sin sonido, y guarda todo. Después puedes jugar incluso en modo avión. Amigos, chat, grupos y avisos necesitan internet.'],
['Mi juego grande (PSP, PS1…) no entra. ¿Qué hago?','Los juegos de PSP y PS1 tienen de 300 MB a más de 1 GB, y Vox lo guarda todo dentro del navegador, así que necesita espacio libre en el móvil. Si aparece sin espacio, libera almacenamiento (borra archivos, apps o el propio .zip después de añadir). Usa el juego como .iso, .cso o .pbp, o el .zip directo. Si falla al guardar, inténtalo de nuevo con la app abierta y la pantalla encendida hasta terminar.'],
['¿Cómo funcionan la Tienda y las Vox coins?','Cada 2 minutos en Vox ganas 1, 5, 10 o 20 Vox coins (la moneda gris vale 1, la roja 5, la azul 10 y la morada 20). Toca las monedas para ver las misiones. En la Tienda compras marcos y fondos o abres cajas con objetos aleatorios; el objeto aparece en Perfil → Marcos y Fondos. Las ofertas con descuento cambian cada 2 horas y los objetos repetidos de las cajas devuelven parte de las monedas.'],
['¿Para qué sirven las carpetas?','Cada carpeta es de una consola y solo acepta ese tipo de archivos. Toca Nueva carpeta para crear una. Para borrar una, ábrela y toca Eliminar esta carpeta: los juegos no se borran, pasan a Sin carpeta.'],
['Mi juego quedó en "Sin carpeta". ¿Y ahora?','Abre la pestaña Sin carpeta y toca Identificar y organizar. Si no lo reconoce, elige la carpeta a mano en la lista de cada juego.'],
['¿Cómo juego y guardo mi progreso?','Toca Jugar. Al tocar Cerrar juego o salir de la app, el progreso se guarda solo y continúas donde lo dejaste. Para empezar de nuevo, toca Del inicio.'],
['¿Cómo cambio la posición y el tamaño de los botones?','En Configuración activa Controles personalizados y toca Mover botones. Elige la consola, arrastra los botones y usa la barra para el tamaño. Imágenes de los botones permite usar PNG o GIF.'],
['El juego va lento o el sonido se corta.','Carga el móvil, desactiva el ahorro de batería, cierra otras apps y pestañas y evita el Fast-Forward. Los FPS aparecen en la esquina. En Configuración hay optimización por juego (Leve o Máxima).'],
['¿Cómo agrego amigos y chateo?','Tu ID es automático (#1, #2...). Toca Amigos, busca el ID de alguien y envía la solicitud. Al aceptarla pueden chatear. El 🗑 junto a tu mensaje lo borra.'],
['¿Cómo envío un audio en el chat?','Abre el chat con un amigo y toca Grabar audio, debajo del botón Enviar. Permite el micrófono si el móvil lo pide. Habla y toca Enviar audio (o ✕ para cancelar). El límite es de 1 minuto. Puedes borrar un audio tuyo con el 🗑.'],
['¿Cómo creo un grupo?','En Amigos toca Crear grupo (junto a Concluir), ponle un nombre, marca a los amigos que entrarán y toca Crear. El grupo aparece en la lista de amigos, tiene de 2 a 20 personas y permite texto y audio. Quien lo creó puede borrarlo y los demás pueden salir.'],
['¿Para qué sirve la campanita?','Muestra mensajes, solicitudes de amistad, novedades de Vox y avisos de nueva versión. Si se mueve, hay algo nuevo.'],
['¿Cómo instalo Vox Emulador en el móvil?','En Chrome toca los tres puntos y elige Instalar app (o Añadir a pantalla de inicio).'],
['Mis juegos desaparecieron. ¿Por qué?','Los juegos se guardan solo en este dispositivo, dentro del navegador. Si borras los datos del sitio, la estantería se vacía.']
],
en:[
['How do I add a game?','1) In Vox Emulador, tap Add games.\n2) Pick the game file. It can be the .zip itself: Vox unzips it by itself. An already extracted file also works (for example .gba, .nes, .iso).\n3) Vox recognizes the console by the extension and puts the game in the right folder. If it can’t tell, the game stays in No folder and you pick the folder.\n.7z and .rar files must be extracted first, with an app like ZArchiver.\nOnly use games you have the right to use: your own copies, homebrew and free games.'],
['I opened a game and only a black menu shows (Main Menu). What is it?','That menu shows up when the emulator opened but got no real game to run. The most common reasons:\n• The file is a tiny .cue (about 1 KB). It is only an index and needs the big .bin file next to it: add the .bin or use a single file (.chd, .iso or .pbp).\n• The file is still inside a .zip: extract it first.\n• The file came incomplete or corrupted.\n• The game is in another console’s folder.'],
['How do I tell a PSP game from a PlayStation 1 game?','PSP: a single .iso, .cso or .pbp file, usually over 100 MB.\nPlayStation 1: .bin files with a .cue, or a .chd file.\nPut each one in the right console folder.'],
['How do I rotate the screen?','In Settings turn on Screen rotate button. The 🔄 button appears under the ? and also inside the game, next to Close game. Tap it to switch between landscape and portrait. If the browser refuses, turn on Android auto-rotate or install the app on your home screen.'],
['Can I add a .zip file directly?','Yes. In Add games pick the .zip and Vox unzips it by itself and puts the game in the right folder (or in No folder if it can’t tell). If it lands in No folder, tap Identify and organize or pick the folder from the game’s ⋮ menu. .7z and .rar files still need to be extracted first, for example with ZArchiver. For Arcade games, choose the Arcade folder before adding, since those stay zipped.'],
['Can I play without internet?','Yes. Games are saved on your device. For the emulator to work offline, Vox has to download its files once: in Settings tap Prepare to play offline (with internet). It opens one game from each console by itself, muted, and keeps everything. After that you can play even in airplane mode. Friends, chat, groups and alerts need internet.'],
['My big game (PSP, PS1…) won’t go in. What now?','PSP and PS1 games are 300 MB to over 1 GB, and Vox keeps everything inside the browser, so it needs free space on your phone. If it says no space, free up storage (delete files, apps or the .zip itself after adding). Use the game as .iso, .cso or .pbp, or the .zip directly. If saving fails, try again with the app open and the screen on until it finishes.'],
['How do the Shop and Vox coins work?','Every 2 minutes in Vox you earn 1, 5, 10 or 20 Vox coins (the grey coin is worth 1, red 5, blue 10 and purple 20). Tap the coins to see missions. In the Shop you buy frames and backgrounds or open boxes with random items; the item shows up in Profile → Frames and Backgrounds. Discount deals change every 2 hours and duplicate items from boxes give back part of the coins.'],
['What are folders for?','Each folder belongs to one console and only accepts that file type. Tap New folder to create one. To remove a folder, open it and tap Delete this folder: the games are not deleted, they move to No folder.'],
['My game ended up in “No folder”. Now what?','Open the No folder tab and tap Identify and organize. If Vox can’t tell, pick the folder by hand in the list on each game.'],
['How do I play and save my progress?','Tap Play. When you tap Close game or leave the app, progress is saved automatically and resumes where you left off. To start over, tap From the start.'],
['How do I change button position and size?','In Settings turn on Custom controls and tap Move buttons. Pick the console, drag the buttons and use the slider for size. Button images lets you use PNG or GIF.'],
['The game is slow or the sound crackles.','Plug in the phone, turn off battery saver, close other apps and tabs and avoid Fast-Forward. FPS shows in the corner. Settings has per-game optimization (Light or Maximum).'],
['How do I add friends and chat?','Your ID is automatic (#1, #2...). Tap Friends, search someone’s ID and send a request. Once accepted you can chat. The 🗑 next to your message deletes it.'],
['How do I send a voice message in chat?','Open the chat with a friend and tap Record audio, under the Send button. Allow the microphone if your phone asks. Speak and tap Send audio (or ✕ to cancel). The limit is 1 minute. You can delete your own audio with the 🗑.'],
['How do I create a group?','In Friends tap Create group (next to Done), give it a name, tick the friends who will join and tap Create. The group shows up in your friends list, has 2 to 20 people and supports text and voice messages. The creator can delete it and the others can leave.'],
['What is the bell for?','It shows messages, friend requests, Vox news and new-version alerts. When it shakes, something is new.'],
['How do I install Vox Emulador on my phone?','In Chrome tap the three dots and choose Install app (or Add to Home screen).'],
['My games disappeared. Why?','Games are stored only on this device, inside the browser. Clearing the site data empties the shelf.']
]};
