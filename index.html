*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}

.empty{border:2px dashed var(--line);border-radius:14px;padding:28px 16px;text-align:center;color:var(--mut)}
#drop.over{background:var(--sel)}

small{color:var(--mut);display:block;margin-top:18px}

#pad{position:fixed;inset:0;z-index:50;pointer-events:none;display:none}#pad.on{display:block}
body.cp .ejs_virtualGamepad_parent{display:none!important}
.pc{position:absolute;transform:translate(-50%,-50%);touch-action:none;user-select:none;-webkit-user-select:none;pointer-events:auto;display:flex;align-items:center;justify-content:center;color:#fff;font:800 calc(var(--u)*.3)/1 system-ui;background:rgba(40,20,70,.55);border:2px solid rgba(181,139,255,.75);border-radius:50%}
.bt{width:var(--u);height:var(--u)}
.bt[data-k=sel],.bt[data-k=sta]{border-radius:999px;width:calc(var(--u)*1.3);height:calc(var(--u)*.5);font-size:calc(var(--u)*.2)}
.dp{width:calc(var(--u)*2.4);height:calc(var(--u)*2.4);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:0;background:none;border:0;border-radius:0}
.dp i{align-self:stretch;justify-self:stretch;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:rgba(40,20,70,.55);border:2px solid rgba(181,139,255,.75);border-radius:12px;font-style:normal;touch-action:none}
.d0{grid-area:1/2}.d1{grid-area:3/2}.d2{grid-area:2/1}.d3{grid-area:2/3}
.pc.on,.dp i.on{background:rgba(181,139,255,.85)}.ed{outline:2px dashed #fff;outline-offset:3px}
#st,#ed{position:fixed;inset:0;z-index:20;display:none}#st.on,#ed.on{display:block}
#st{background:rgba(0,0,0,.6);overflow:auto;padding:20px 16px}
.card{max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px}
.card h2{margin:0;font:800 22px 'Bricolage Grotesque',system-ui}.card label{display:grid;gap:6px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#ed{background:#0b0614}#padE{position:absolute;inset:0;z-index:5;pointer-events:none}#pc{z-index:60!important}
.scr{position:absolute;left:22%;top:18%;width:56%;height:56%;border:2px dashed #4a3a78;border-radius:8px}
.eb{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:8px;align-items:center;background:rgba(20,10,35,.9);color:#fff;border-radius:12px;padding:6px 10px;font-size:13px}
.eb input{width:110px}.eb{flex-wrap:wrap;justify-content:center;max-width:94vw}.eb select{max-width:150px}.pc.on{filter:brightness(1.35)}

@keyframes zrot{to{--ang:360deg}}

@keyframes zbg{0%{background-position:0% 50%}100%{background-position:400% 50%}}
body.rgbbg:not(.ing)::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(120deg,#7a2fe0,#2f7ae0,#2fe0a0,#e0d02f,#e02f7a,#7a2fe0);background-size:400% 100%;opacity:.38;animation:zbg 14s linear infinite}
#skp{position:fixed;inset:0;z-index:25;display:none;background:rgba(0,0,0,.8);overflow:auto;padding:20px 16px}#skp.on{display:block}.mb .xm{background:none;border:0;padding:0 0 0 8px;font-size:12px;opacity:.55;color:inherit;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);z-index:70;background:var(--card);color:var(--ink);border:1px solid var(--acc);border-radius:12px;padding:10px 16px;opacity:0;pointer-events:none;transition:opacity .3s;max-width:90vw;text-align:center}#toast.on{opacity:1}
#achl{display:grid;gap:2px;max-height:30vh;overflow:auto}.arow{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.arow.lk{opacity:.55}
body.ing main,body.ing #bn{display:none!important}#fps{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);left:8px;z-index:60;font:600 12px system-ui;color:#fff;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:6px;display:none}body.pf #fps{display:block}
.fi{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.fi .av{width:40px;height:40px}.fi .nm{flex:1 1 120px;min-width:0;overflow-wrap:anywhere}.fi button{padding:6px 10px;min-height:36px}
#msgs{display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:12px}.mb{max-width:80%;padding:6px 10px;border-radius:12px;background:var(--sel);align-self:flex-start;overflow-wrap:anywhere}.mb.me{align-self:flex-end;background:var(--acc);color:var(--bg)}
.chip{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:6px 16px 6px 6px;border-radius:999px}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--acc);flex:none}
#pf,#ot,#fr,#nc,#hp,#au,#cs,#gm{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.6);overflow:auto;padding:20px 16px}#pf.on,#ot.on,#fr.on,#nc.on,#hp.on,#au.on,#cs.on,#gm.on{display:block}
#cs{z-index:26}

#pcard{display:flex;gap:10px;align-items:center;background:linear-gradient(180deg,#1b1044,#120a38);border:1px solid #4a2a9a;border-radius:20px;padding:12px;margin-bottom:12px;box-shadow:0 0 20px rgba(120,60,255,.22)}

#pcard #fr0{border-radius:14px;border:1px solid #6a3fd0;background:linear-gradient(180deg,#2a1670,#1b0e50);padding:10px 14px;font-weight:700;white-space:nowrap}
.onl{color:#c9b8ff;font-size:13px}.onl:empty{display:none}.onl::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:#2bd96b;margin-right:6px;box-shadow:0 0 8px #2bd96b}

const HT={pt:'Ajuda',es:'Ayuda',en:'Help',ru:'Помощь',ja:'ヘルプ',de:'Hilfe',fr:'Aide',it:'Aiuto'};
const FQ={
pt:[
['Como adiciono um jogo?','1) No Zeo Emulador, toque em Adicionar jogos.\n2) Escolha o arquivo do jogo. Pode ser o .zip direto: o Zeo descompacta sozinho. Também serve o arquivo já extraído (por exemplo .gba, .nes, .iso).\n3) O Zeo reconhece o console pela extensão e coloca o jogo na pasta certa. Se não reconhecer, o jogo fica em Sem pasta e você escolhe a pasta.\nArquivos .7z e .rar precisam ser extraídos antes, com um app como o ZArchiver.\nUse só jogos que você tem direito de usar: cópias suas, homebrew e jogos livres.'],
['Abri um jogo e só aparece um menu preto (Main Menu). O que é?','Esse menu aparece quando o emulador abriu, mas não recebeu um jogo de verdade para rodar. Os motivos mais comuns:\n• O arquivo é um .cue pequeno (cerca de 1 KB). Ele é só um índice e precisa do arquivo .bin grande junto: adicione o .bin ou use um arquivo único (.chd, .iso ou .pbp).\n• O arquivo ainda está dentro de um .zip: extraia antes.\n• O arquivo veio incompleto ou corrompido.\n• O jogo está na pasta de outro console.'],
['Como sei se meu jogo é de PSP ou de PlayStation 1?','PSP: um único arquivo .iso, .cso ou .pbp, normalmente com mais de 100 MB.\nPlayStation 1: arquivos .bin com .cue, ou um arquivo .chd.\nColoque cada um na pasta do console certo.'],
['Como giro a tela?','Em Configurações, ligue Botão de girar a tela. O botão 🔄 aparece abaixo do ? e também dentro do jogo, ao lado de Fechar jogo. Toque nele para alternar entre horizontal e vertical. Se o navegador não deixar, ligue a rotação automática do Android ou instale o app na tela inicial.'],
['Posso adicionar um arquivo .zip direto?','Pode. Em Adicionar jogos, escolha o .zip e o Zeo descompacta sozinho e coloca o jogo na pasta certa (ou em Sem pasta, se não souber qual é). Se ficar em Sem pasta, toque em Identificar e organizar ou escolha a pasta no ⋮ do jogo. Arquivos .7z e .rar ainda precisam ser extraídos antes, por exemplo com o ZArchiver. Se o arquivo for de Arcade, escolha a pasta Arcade antes de adicionar, que ele fica zipado.'],
['Dá para jogar sem internet?','Sim. Os jogos ficam salvos no seu aparelho. Para o emulador funcionar sem internet, o Zeo precisa baixar os arquivos dele uma vez: em Configurações, toque em Preparar para jogar offline (com internet). Ele abre um jogo de cada console sozinho, sem som, e guarda tudo. Depois dá para jogar até no modo avião. Amigos, chat, grupos e avisos precisam de internet.'],
['Meu jogo grande (PSP, PS1…) não entra. O que faço?','Jogos de PSP e PS1 têm de 300 MB a mais de 1 GB, e o Zeo guarda tudo dentro do navegador, então precisa de espaço livre no celular. Se aparecer sem espaço, libere armazenamento (apague arquivos, apps ou o próprio .zip depois de adicionar). Use o jogo como .iso, .cso ou .pbp, ou o .zip direto. Se der erro ao guardar, tente de novo com o app aberto e a tela ligada até terminar.'],
['Para que servem as pastas?','Cada pasta é de um console e só aceita arquivos daquele tipo. Toque em Nova pasta para criar uma. Para apagar uma pasta, abra ela e toque em Excluir esta pasta: os jogos não são apagados, vão para Sem pasta.'],
['Meu jogo ficou em "Sem pasta". E agora?','Abra a aba Sem pasta e toque em Identificar e organizar: o Zeo tenta reconhecer o console de cada jogo. Se não reconhecer, escolha a pasta manualmente na lista que aparece em cada jogo.'],
['Como jogo e salvo meu progresso?','Toque em Jogar. Ao tocar em Fechar jogo ou sair do app, o progresso é salvo sozinho e volta de onde você parou. Para recomeçar, toque em Do início no jogo.'],
['Como mudo o lugar e o tamanho dos botões?','Em Configurações, ligue Controles personalizados e toque em Mover botões. Escolha o console na lista, arraste os botões e use a barra para mudar o tamanho. O botão Imagens dos botões deixa você usar PNG ou GIF.'],
['O jogo está lento ou o som chia. O que faço?','Deixe o celular carregando, desligue a economia de bateria, feche outros apps e abas e evite o Fast-Forward. O número FPS aparece no canto da tela. Nas Configurações há a otimização por jogo (Leve ou Máxima).'],
['Como adiciono amigos e converso?','Seu ID é automático (#1, #2...). Toque em Amigos, pesquise o ID de alguém e envie o pedido. Depois de aceito, vocês podem conversar. O 🗑 ao lado da sua mensagem apaga ela.'],
['Como mando áudio no chat?','Abra o chat com um amigo e toque em Gravar áudio, abaixo do botão Enviar. Permita o microfone se o celular pedir. Fale e toque em Enviar áudio (ou ✕ para cancelar). O limite é de 1 minuto. Você pode apagar um áudio seu com o 🗑.'],
['Como crio um grupo?','Em Amigos, toque em Criar grupo (ao lado de Concluir), dê um nome, marque os amigos que vão entrar e toque em Criar. O grupo aparece na lista de amigos, tem de 2 a 20 pessoas e dá para mandar texto e áudio. Quem criou pode apagar o grupo, e os outros podem sair.'],
['Para que serve o sininho?','Ele mostra mensagens, pedidos de amizade, novidades do Zeo e avisos de nova versão. Quando balança, tem algo novo.'],
['Como instalo o Zeo Emulador no celular?','No Chrome, toque nos três pontinhos e escolha Instalar app (ou Adicionar à tela inicial).'],
['Meus jogos sumiram. Por quê?','Os jogos ficam salvos só neste aparelho, dentro do navegador. Se você limpar os dados do site, a estante é apagada.']
],
es:[
['¿Cómo agrego un juego?','1) En Zeo Emulador toca Agregar juegos.\n2) Elige el archivo del juego. Puede ser el .zip directo: Zeo lo descomprime solo. También sirve el archivo ya extraído (por ejemplo .gba, .nes, .iso).\n3) Zeo reconoce la consola por la extensión y pone el juego en la carpeta correcta. Si no la reconoce, el juego queda en Sin carpeta y tú eliges la carpeta.\nLos archivos .7z y .rar hay que extraerlos antes, con una app como ZArchiver.\nUsa solo juegos que tengas derecho a usar: copias tuyas, homebrew y juegos libres.'],
['Abrí un juego y solo aparece un menú negro (Main Menu). ¿Qué es?','Ese menú aparece cuando el emulador abrió pero no recibió un juego real para ejecutar. Los motivos más comunes:\n• El archivo es un .cue pequeño (unos 1 KB). Es solo un índice y necesita el archivo .bin grande: agrega el .bin o usa un archivo único (.chd, .iso o .pbp).\n• El archivo sigue dentro de un .zip: extráelo antes.\n• El archivo llegó incompleto o dañado.\n• El juego está en la carpeta de otra consola.'],
['¿Cómo sé si mi juego es de PSP o de PlayStation 1?','PSP: un único archivo .iso, .cso o .pbp, normalmente de más de 100 MB.\nPlayStation 1: archivos .bin con .cue, o un archivo .chd.\nPon cada uno en la carpeta de la consola correcta.'],
['¿Cómo giro la pantalla?','En Configuración activa Botón para girar la pantalla. El botón 🔄 aparece debajo del ? y también dentro del juego, junto a Cerrar juego. Tócalo para alternar entre horizontal y vertical. Si el navegador no lo permite, activa la rotación automática de Android o instala la app en la pantalla de inicio.'],
['¿Puedo añadir un archivo .zip directamente?','Sí. En Añadir juegos elige el .zip y Zeo lo descomprime solo y pone el juego en la carpeta correcta (o en Sin carpeta si no sabe cuál es). Si queda en Sin carpeta, toca Identificar y organizar o elige la carpeta en el ⋮ del juego. Los archivos .7z y .rar aún hay que extraerlos antes, por ejemplo con ZArchiver. Si es de Arcade, elige la carpeta Arcade antes de añadir, porque se queda comprimido.'],
['¿Se puede jugar sin internet?','Sí. Los juegos se guardan en tu dispositivo. Para que el emulador funcione sin internet, Zeo debe descargar sus archivos una vez: en Configuración toca Preparar para jugar sin conexión (con internet). Abre un juego de cada consola solo, sin sonido, y guarda todo. Después puedes jugar incluso en modo avión. Amigos, chat, grupos y avisos necesitan internet.'],
['Mi juego grande (PSP, PS1…) no entra. ¿Qué hago?','Los juegos de PSP y PS1 tienen de 300 MB a más de 1 GB, y Zeo lo guarda todo dentro del navegador, así que necesita espacio libre en el móvil. Si aparece sin espacio, libera almacenamiento (borra archivos, apps o el propio .zip después de añadir). Usa el juego como .iso, .cso o .pbp, o el .zip directo. Si falla al guardar, inténtalo de nuevo con la app abierta y la pantalla encendida hasta terminar.'],
['¿Para qué sirven las carpetas?','Cada carpeta es de una consola y solo acepta ese tipo de archivos. Toca Nueva carpeta para crear una. Para borrar una, ábrela y toca Eliminar esta carpeta: los juegos no se borran, pasan a Sin carpeta.'],
['Mi juego quedó en "Sin carpeta". ¿Y ahora?','Abre la pestaña Sin carpeta y toca Identificar y organizar. Si no lo reconoce, elige la carpeta a mano en la lista de cada juego.'],
['¿Cómo juego y guardo mi progreso?','Toca Jugar. Al tocar Cerrar juego o salir de la app, el progreso se guarda solo y continúas donde lo dejaste. Para empezar de nuevo, toca Del inicio.'],
['¿Cómo cambio la posición y el tamaño de los botones?','En Configuración activa Controles personalizados y toca Mover botones. Elige la consola, arrastra los botones y usa la barra para el tamaño. Imágenes de los botones permite usar PNG o GIF.'],
['El juego va lento o el sonido se corta.','Carga el móvil, desactiva el ahorro de batería, cierra otras apps y pestañas y evita el Fast-Forward. Los FPS aparecen en la esquina. En Configuración hay optimización por juego (Leve o Máxima).'],
['¿Cómo agrego amigos y chateo?','Tu ID es automático (#1, #2...). Toca Amigos, busca el ID de alguien y envía la solicitud. Al aceptarla pueden chatear. El 🗑 junto a tu mensaje lo borra.'],
['¿Cómo envío un audio en el chat?','Abre el chat con un amigo y toca Grabar audio, debajo del botón Enviar. Permite el micrófono si el móvil lo pide. Habla y toca Enviar audio (o ✕ para cancelar). El límite es de 1 minuto. Puedes borrar un audio tuyo con el 🗑.'],
['¿Cómo creo un grupo?','En Amigos toca Crear grupo (junto a Concluir), ponle un nombre, marca a los amigos que entrarán y toca Crear. El grupo aparece en la lista de amigos, tiene de 2 a 20 personas y permite texto y audio. Quien lo creó puede borrarlo y los demás pueden salir.'],
['¿Para qué sirve la campanita?','Muestra mensajes, solicitudes de amistad, novedades de Zeo y avisos de nueva versión. Si se mueve, hay algo nuevo.'],
['¿Cómo instalo Zeo Emulador en el móvil?','En Chrome toca los tres puntos y elige Instalar app (o Añadir a pantalla de inicio).'],
['Mis juegos desaparecieron. ¿Por qué?','Los juegos se guardan solo en este dispositivo, dentro del navegador. Si borras los datos del sitio, la estantería se vacía.']
],
en:[
['How do I add a game?','1) In Zeo Emulador, tap Add games.\n2) Pick the game file. It can be the .zip itself: Zeo unzips it by itself. An already extracted file also works (for example .gba, .nes, .iso).\n3) Zeo recognizes the console by the extension and puts the game in the right folder. If it can’t tell, the game stays in No folder and you pick the folder.\n.7z and .rar files must be extracted first, with an app like ZArchiver.\nOnly use games you have the right to use: your own copies, homebrew and free games.'],
['I opened a game and only a black menu shows (Main Menu). What is it?','That menu shows up when the emulator opened but got no real game to run. The most common reasons:\n• The file is a tiny .cue (about 1 KB). It is only an index and needs the big .bin file next to it: add the .bin or use a single file (.chd, .iso or .pbp).\n• The file is still inside a .zip: extract it first.\n• The file came incomplete or corrupted.\n• The game is in another console’s folder.'],
['How do I tell a PSP game from a PlayStation 1 game?','PSP: a single .iso, .cso or .pbp file, usually over 100 MB.\nPlayStation 1: .bin files with a .cue, or a .chd file.\nPut each one in the right console folder.'],
['How do I rotate the screen?','In Settings turn on Screen rotate button. The 🔄 button appears under the ? and also inside the game, next to Close game. Tap it to switch between landscape and portrait. If the browser refuses, turn on Android auto-rotate or install the app on your home screen.'],
['Can I add a .zip file directly?','Yes. In Add games pick the .zip and Zeo unzips it by itself and puts the game in the right folder (or in No folder if it can’t tell). If it lands in No folder, tap Identify and organize or pick the folder from the game’s ⋮ menu. .7z and .rar files still need to be extracted first, for example with ZArchiver. For Arcade games, choose the Arcade folder before adding, since those stay zipped.'],
['Can I play without internet?','Yes. Games are saved on your device. For the emulator to work offline, Zeo has to download its files once: in Settings tap Prepare to play offline (with internet). It opens one game from each console by itself, muted, and keeps everything. After that you can play even in airplane mode. Friends, chat, groups and alerts need internet.'],
['My big game (PSP, PS1…) won’t go in. What now?','PSP and PS1 games are 300 MB to over 1 GB, and Zeo keeps everything inside the browser, so it needs free space on your phone. If it says no space, free up storage (delete files, apps or the .zip itself after adding). Use the game as .iso, .cso or .pbp, or the .zip directly. If saving fails, try again with the app open and the screen on until it finishes.'],
['What are folders for?','Each folder belongs to one console and only accepts that file type. Tap New folder to create one. To remove a folder, open it and tap Delete this folder: the games are not deleted, they move to No folder.'],
['My game ended up in “No folder”. Now what?','Open the No folder tab and tap Identify and organize. If Zeo can’t tell, pick the folder by hand in the list on each game.'],
['How do I play and save my progress?','Tap Play. When you tap Close game or leave the app, progress is saved automatically and resumes where you left off. To start over, tap From the start.'],
['How do I change button position and size?','In Settings turn on Custom controls and tap Move buttons. Pick the console, drag the buttons and use the slider for size. Button images lets you use PNG or GIF.'],
['The game is slow or the sound crackles.','Plug in the phone, turn off battery saver, close other apps and tabs and avoid Fast-Forward. FPS shows in the corner. Settings has per-game optimization (Light or Maximum).'],
['How do I add friends and chat?','Your ID is automatic (#1, #2...). Tap Friends, search someone’s ID and send a request. Once accepted you can chat. The 🗑 next to your message deletes it.'],
['How do I send a voice message in chat?','Open the chat with a friend and tap Record audio, under the Send button. Allow the microphone if your phone asks. Speak and tap Send audio (or ✕ to cancel). The limit is 1 minute. You can delete your own audio with the 🗑.'],
['How do I create a group?','In Friends tap Create group (next to Done), give it a name, tick the friends who will join and tap Create. The group shows up in your friends list, has 2 to 20 people and supports text and voice messages. The creator can delete it and the others can leave.'],
['What is the bell for?','It shows messages, friend requests, Zeo news and new-version alerts. When it shakes, something is new.'],
['How do I install Zeo Emulador on my phone?','In Chrome tap the three dots and choose Install app (or Add to Home screen).'],
['My games disappeared. Why?','Games are stored only on this device, inside the browser. Clearing the site data empties the shelf.']
]};

function drawAu(sel){const l=$('#aul');l.innerHTML='';const bs='display:block;width:100%;text-align:left;margin-bottom:8px';cfg.au=cfg.au||{};

  items.forEach(g=>{const b=document.createElement('button');b.textContent=g.name+' — '+ax('l'+(cfg.au[g.id]||0));b.style.cssText=bs;b.onclick=()=>drawAu(g.id);l.append(b)});
  const n=document.createElement('div');n.textContent=ax('n');n.style.cssText='color:var(--mut);font-size:13px;margin-top:6px';l.append(n)}
 else{const g=items.find(x=>x.id===sel);if(!g){drawAu(null);return}
  const n=document.createElement('b');n.textContent=g.name;n.style.cssText='display:block;margin-bottom:10px;overflow-wrap:anywhere';l.append(n);
  [0,1,2].forEach(v=>{const b=document.createElement('button');b.textContent=((cfg.au[sel]||0)===v?'✔ ':'')+ax('l'+v)+' — '+ax('d'+v);b.style.cssText=bs;b.onclick=()=>{cfg.au[sel]=v;saveCfg();drawAu(null)};l.append(b)});

const coreOf=g=>{const fd=fo(g.folder);return (fd&&fd.core)||CORES[ext(g.name)]};
function primeStart(){if(!navigator.onLine){note(px('of'));return}
 const by={};items.forEach(g=>{const c=coreOf(g);if(!c||c==='none')return;if(!by[c]||g.size<by[c].size)by[c]=g});
 const q=Object.values(by).map(g=>g.id);if(!q.length){note(px('ng'));return}if(!confirm(px('c')))return;
 sessionStorage.setItem('zprime',JSON.stringify({q,i:0,fail:[],n:q.length}));location.reload()}
async function runPrime(){let st=null;try{st=JSON.parse(sessionStorage.getItem('zprime'))}catch(e){}if(!st){sessionStorage.removeItem('zprime');return}
 const done=()=>{sessionStorage.removeItem('zprime');sessionStorage.setItem('zprimeMsg',JSON.stringify({ok:st.n-st.fail.length,fail:st.fail}));location.reload()};
 if(st.i>=st.q.length)return done();
 const g=items.find(x=>x.id===st.q[st.i]),next=bad=>{if(bad)st.fail.push(g?g.name:'?');st.i++;sessionStorage.setItem('zprime',JSON.stringify(st));location.reload()};
 if(!g)return next(true);
 window.__prime=1;window.EJS_volume=0;
 const box=document.createElement('div');box.style.cssText='position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:70;text-align:center;color:#fff;font:600 14px system-ui;text-shadow:0 1px 4px #000;pointer-events:none';
 box.textContent=px('p').replace('%1',st.i+1).replace('%2',st.n).replace('%3',lab(g.folder));document.body.append(box);
 const cb=document.createElement('button');cb.textContent=px('x');cb.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 96px);z-index:71';cb.onclick=()=>{sessionStorage.removeItem('zprime');location.reload()};document.body.append(cb);
 play(g);
 const t0=Date.now(),iv=setInterval(()=>{const e=window.EJS_emulator;if(e&&e.started){clearInterval(iv);setTimeout(()=>next(false),4000)}else if(window.__loadFail||Date.now()-t0>180000){clearInterval(iv);next(true)}},1000)}
