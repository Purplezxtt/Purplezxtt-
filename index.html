<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--card:#1e222d;--ink:#eceef4;--mut:#9aa2b5;--acc:#b58bff;--line:#2e3445;--sel:#2c2347}}
:root[data-theme="dark"]{--bg:#14171f;--card:#1e222d;--ink:#eceef4;--mut:#9aa2b5;--acc:#b58bff;--line:#2e3445;--sel:#2c2347}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:8px}.hd h1{margin:0}.hd p.by{margin:2px 0 0}.logo{width:84px;height:84px;flex:none;image-rendering:pixelated}
h1{font:800 30px/1.1 'Bricolage Grotesque',system-ui,sans-serif;margin:8px 0 6px}
p.by{margin:0 0 8px;color:var(--acc);font-weight:600}p.sub{color:var(--mut);margin:0 0 20px;max-width:60ch}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button,select,input[type=text]{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;min-height:44px}
button{cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.tab{white-space:nowrap;border-radius:999px;padding:7px 14px;min-height:40px}
.tab[aria-pressed=true]{background:var(--sel);border-color:var(--acc);font-weight:600}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;flex-wrap:wrap}
.item .n{flex:1 1 180px;min-width:0;overflow-wrap:anywhere;font-weight:600}
.item .s{color:var(--mut);font-size:13px;font-weight:400;display:block}
.item select{max-width:150px;padding:6px 8px;min-height:40px}
.item button{padding:6px 12px;min-height:40px}
.empty{border:2px dashed var(--line);border-radius:14px;padding:28px 16px;text-align:center;color:var(--mut)}
#drop.over{background:var(--sel)}

small{color:var(--mut);display:block;margin-top:18px}

#pad{position:fixed;inset:0;z-index:50;pointer-events:none;display:none}#pad.on{display:block}
body.cp .ejs_virtualGamepad_parent{display:none!important}
.pc{position:absolute;transform:translate(-50%,-50%);touch-action:none;user-select:none;-webkit-user-select:none;pointer-events:auto;display:flex;align-items:center;justify-content:center;color:#fff;font:800 calc(var(--u)*.3)/1 system-ui;background:rgba(40,20,70,.55);border:2px solid rgba(181,139,255,.75);border-radius:50%}
.bt{width:var(--u);height:var(--u)}
.bt[data-k=sel],.bt[data-k=sta]{border-radius:999px;width:calc(var(--u)*1.3);height:calc(var(--u)*.5);font-size:calc(var(--u)*.2)}
.dp{width:calc(var(--u)*2.4);height:calc(var(--u)*2.4);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:0;background:none;border:0;border-radius:0}
.dp i{align-self:stretch;justify-self:stretch;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:rgba(40,20,70,.55);border:2px solid rgba(181,139,255,.75);border-radius:12px;font-style:normal;touch-action:none}
.d0{grid-area:1/2}.d1{grid-area:3/2}.d2{grid-area:2/1}.d3{grid-area:2/3}
.pc.on,.dp i.on{background:rgba(181,139,255,.85)}.ed{outline:2px dashed #fff;outline-offset:3px}
#st,#ed{position:fixed;inset:0;z-index:20;display:none}#st.on,#ed.on{display:block}
#st{background:rgba(0,0,0,.6);overflow:auto;padding:20px 16px}
.card{max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px}
.card h2{margin:0;font:800 22px 'Bricolage Grotesque',system-ui}.card label{display:grid;gap:6px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#ed{background:#0b0614}#padE{position:absolute;inset:0;z-index:5;pointer-events:none}#pc{z-index:60!important}
.scr{position:absolute;left:22%;top:18%;width:56%;height:56%;border:2px dashed #4a3a78;border-radius:8px}
.eb{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:8px;align-items:center;background:rgba(20,10,35,.9);color:#fff;border-radius:12px;padding:6px 10px;font-size:13px}
.eb input{width:110px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);z-index:70;background:var(--card);color:var(--ink);border:1px solid var(--acc);border-radius:12px;padding:10px 16px;opacity:0;pointer-events:none;transition:opacity .3s;max-width:90vw;text-align:center}#toast.on{opacity:1}
#achl{display:grid;gap:2px;max-height:30vh;overflow:auto}.arow{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.arow.lk{opacity:.55}
#fps{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);left:8px;z-index:60;font:600 12px system-ui;color:#fff;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:6px;display:none}body.pf #fps{display:block}
.fi{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.fi .av{width:40px;height:40px}.fi .nm{flex:1 1 120px;min-width:0;overflow-wrap:anywhere}.fi button{padding:6px 10px;min-height:36px}
#msgs{display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:12px}.mb{max-width:80%;padding:6px 10px;border-radius:12px;background:var(--sel);align-self:flex-start;overflow-wrap:anywhere}.mb.me{align-self:flex-end;background:var(--acc);color:var(--bg)}
.chip{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:6px 16px 6px 6px;border-radius:999px}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--acc);flex:none}
#pf,#ot,#fr{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.6);overflow:auto;padding:20px 16px}#pf.on,#ot.on,#fr.on{display:block}

  if(!r)c.append(mkb(ta('f_add'),async()=>{try{await FB.fs.setDoc(FB.fs.doc(FB.db,'reqs',pk(prof.id,id)),{from:prof.id,to:id,fromUid:FB.uid,toUid:p.uid,status:'pending',t:Date.now()});res.textContent=ta('f_sent')}catch(e){note(ta('f_err'))}},1));
  else if(r.status==='accepted')c.append(mkb(ta('f_chat'),()=>openChat(r),1));
  else if(r.status==='pending'&&r.toUid===FB.uid)c.append(mkb(ta('f_acc'),()=>upd(r,{status:'accepted'}),1));
  else{const m=document.createElement('span');m.textContent=r.status==='pending'?ta('f_sent'):ta('f_blk');c.append(m)}
  res.append(c)}catch(e){note(ta('f_err'))}}
function openChat(r){chatKey=r.id;const b=$('#frb');b.innerHTML='';const o=r.from===prof.id?r.to:r.from;
 const hd=document.createElement('div');hd.className='row';const t0=document.createElement('b');t0.style.flex='1';t0.textContent='ID '+o;getP(o).then(p=>{if(p)t0.textContent=p.name+' · ID '+o}).catch(()=>{});hd.append(mkb('←',frHome),t0);
 const act=document.createElement('div');act.className='row';
 [[ta('f_rm'),()=>{if(confirm(ta('f_rm')+'?')){del(r);frHome()}}],[ta('f_bl'),()=>{if(confirm(ta('f_bl')+'?')){upd(r,{status:'blocked',blockedBy:FB.uid});frHome()}}],[ta('f_rp'),async()=>{if(!confirm(ta('f_rp')+'?'))return;try{await FB.fs.addDoc(FB.fs.collection(FB.db,'reports'),{by:prof.id,byUid:FB.uid,target:o,pair:r.id,t:Date.now()});note(ta('f_rpok'))}catch(e){note(ta('f_err'))}}]].forEach(([x,fn])=>{const bt=mkb(x,fn);bt.style.cssText='padding:4px 10px;min-height:32px;font-size:13px';act.append(bt)});
 const ms=document.createElement('div');ms.id='msgs';
 const inp=document.createElement('input');inp.type='text';inp.maxLength=500;inp.placeholder=ta('f_msg');inp.style.cssText='flex:1;min-width:0';
 const send=async()=>{const x=inp.value.trim();if(!x)return;inp.value='';try{await FB.fs.addDoc(FB.fs.collection(FB.db,'reqs',r.id,'msgs'),{fromUid:FB.uid,from:prof.id,text:x,t:Date.now()})}catch(e){note(ta('f_err'))}};
 inp.onkeydown=e=>{if(e.key==='Enter')send()};
 const cr=document.createElement('div');cr.className='row';cr.append(inp,mkb(ta('f_send'),send,1));b.append(hd,act,ms,cr);
 const{query,collection,orderBy,limitToLast,onSnapshot}=FB.fs;
 chatU=onSnapshot(query(collection(FB.db,'reqs',r.id,'msgs'),orderBy('t'),limitToLast(100)),s=>{ms.innerHTML='';s.docs.forEach(d=>{const m=d.data(),e=document.createElement('div');e.className='mb'+(m.fromUid===FB.uid?' me':'');e.textContent=m.text;ms.append(e)});ms.scrollTop=ms.scrollHeight;const mx=Math.max(0,...s.docs.map(d=>d.data().t||0));if(mx>(cfg.read[r.id]||0)){cfg.read[r.id]=mx;saveCfg()}UNR[r.id]=0;badge()},()=>note(ta('f_err')))}
$('#fr0').onclick=async()=>{if(!prof.pub){note(ta('f_need'));return}try{await startFr()}catch(e){note(ta('f_err'));return}frHome();$('#fr').classList.add('on')};
$('#frx').onclick=()=>{if(chatU){chatU();chatU=null}chatKey=null;$('#fr').classList.remove('on')};
(function(){const h=$('.hd h1'),t='Zeo Emulador';h.textContent='';h.style.userSelect='none';
 [...t].forEach((c,i)=>{const s=document.createElement('span');s.textContent=c;s.dataset.k=i;s.style.whiteSpace='pre';h.append(s)});
 h.onclick=e=>{const k=e.target.dataset&&e.target.dataset.k;if(k===undefined||t[k]===' ')return;e.target.style.opacity='.4';setTimeout(()=>{e.target.style.opacity=''},150);(cfg.ach.tl=cfg.ach.tl||{})[k]=1;saveCfg();checkAch()}})();
const HAS=new Set();let curGame=null;
async function saveRun(){if(!curGame||!cfg.resume||!$('#player').classList.contains('on'))return;
 try{const gm=window.EJS_emulator&&window.EJS_emulator.gameManager;if(!gm)return;const st=gm.getState();if(!st||!st.length||st.length>83886080)return;
  await tx('meta','readwrite',s=>s.put({t:Date.now(),d:st},'st:'+curGame.id));HAS.add(curGame.id)}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveRun()});
window.addEventListener('pagehide',()=>{saveRun()});
$('#rz').onchange=e=>{cfg.resume=e.target.checked;saveCfg()};
const UNR={},CW={};let reqBase=0;const seenReq=new Set();
function notify(title,body,tag){if(!cfg.notif)return;
 if(document.visibilityState==='visible'){note('🔔 '+title+': '+body);try{if(navigator.vibrate)navigator.vibrate(60)}catch(e){}}
 else if('Notification' in window&&Notification.permission==='granted'&&navigator.serviceWorker){navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png',tag,renotify:true})).catch(()=>{})}}
function watchChats(){const f=FB;if(!f)return;const{query,collection,where,orderBy,onSnapshot}=f.fs;const acc=REQ.filter(r=>r.status==='accepted');
 Object.keys(CW).forEach(k=>{if(!acc.find(r=>r.id===k)){CW[k]();delete CW[k];delete UNR[k]}});
 acc.forEach(r=>{if(CW[r.id])return;let first=1;
  CW[r.id]=onSnapshot(query(collection(f.db,'reqs',r.id,'msgs'),where('t','>',cfg.read[r.id]||0),orderBy('t')),s=>{
   if(chatKey===r.id){first=0;return}
   const rd=cfg.read[r.id]||0;UNR[r.id]=s.docs.filter(d=>d.data().fromUid!==f.uid&&(d.data().t||0)>rd).length;
   if(!first)s.docChanges().forEach(c=>{const m=c.doc.data();if(c.type==='added'&&m.fromUid!==f.uid){const o=r.from===prof.id?r.to:r.from;getP(o).then(p=>notify((p&&p.name)||('ID '+o),m.text,r.id)).catch(()=>notify('ID '+o,m.text,r.id))}});
   first=0;badge();if($('#frl')&&!chatKey&&$('#fr').classList.contains('on'))frList()},()=>{})})}
$('#nt').onchange=async e=>{cfg.notif=e.target.checked;saveCfg();if(cfg.notif&&'Notification' in window&&Notification.permission==='default'){try{await Notification.requestPermission()}catch(x){}}};
const A1=['Roxo','Neon','Pixel','Turbo','Astro','Cosmo','Sombra','Nova','Lunar','Ninja'],A2=['Gamer','Fox','Dragon','Byte','Wolf','Comet','Ghost','Rider','Spark','Hero'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rndName=()=>pick(A1)+pick(A2)+(10+Math.floor(Math.random()*90));
const setAv=(img,b)=>{img.src=b?URL.createObjectURL(b):'icon-192.png'};
function renderProf(){$('#pnm').textContent=prof.id?prof.name:t('prof');$('#pid').textContent=prof.id?'ID '+prof.id+(cfg.achOn?' · 🏆 '+Object.keys(cfg.ach.u).length:''):'';$('#ao').checked=cfg.achOn;$('#aol').textContent=ta('aon');$('#og').textContent=ta('og');badge();$('#nt').checked=cfg.notif;$('#ntl').textContent=ta('f_not');$('#rz').checked=cfg.resume;$('#rzl').textContent=ta('f_res');renderAchList();setAv($('#pav'),prof.avatar)}
$('#prof').onclick=()=>{tmpAv=prof.avatar;$('#pn').value=prof.name;$('#pi').value=prof.id;$('#pmsg').textContent='';setAv($('#pav2'),tmpAv);$('#pf').classList.add('on')};
$('#pph').onclick=()=>$('#pfile').click();
$('#pfile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>5242880){$('#pmsg').textContent=t('big');return}tmpAv=f;setAv($('#pav2'),f);$('#pmsg').textContent=''};
$('#prn').onclick=()=>{$('#pn').value=rndName()};
$('#pi').oninput=e=>{e.target.value=e.target.value.replace(/[^0-9]/g,'').slice(0,7)};
$('#psv').onclick=async()=>{const id=$('#pi').value.trim();
 if(!/^[0-9]{1,7}$/.test(id)){$('#pmsg').textContent=t('bad');return}
 const old=prof;prof={name:$('#pn').value.trim()||rndName(),id,avatar:tmpAv,pub:old.pub};
 try{await publish()}catch(e){if(String(e&&e.message||e).includes('taken')){prof=old;$('#pmsg').textContent=ta('f_taken');return}note(ta('f_err'))}
 await tx('meta','readwrite',s=>s.put(prof,'profile')).catch(()=>{});checkAch();renderProf();$('#pf').classList.remove('on')};
$('#pcl').onclick=()=>$('#pf').classList.remove('on');
const dr=$('#drop');
dr.ondragover=e=>{e.preventDefault();dr.classList.add('over')};
dr.ondragleave=()=>dr.classList.remove('over');
dr.ondrop=e=>{e.preventDefault();dr.classList.remove('over');addFiles([...e.dataTransfer.files])};
load();
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(()=>{if(!window.crossOriginIsolated&&!/noiso/.test(location.search)&&!sessionStorage.getItem('zeoiso')&&navigator.serviceWorker.controller){sessionStorage.setItem('zeoiso','1');location.reload()}}).catch(()=>{})}catch(e){}}
